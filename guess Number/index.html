<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Number</title>
    <style>
        .container {
            text-align: center;
            margin-top: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Guess Number</h1>
        <p>Guess a number between 1 and 100</p>
        <input type="number" id="guessField" class="form-control" min="1" max="100">
        <button id="check" class="btn btn-primary">check</button>
        <p id="result"></p>
    </div>
    <script src="index.js"></script>
</body>
</html>
