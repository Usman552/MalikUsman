<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f1c40f;
        }

        .clock {
            background-color: #2c3e50;
            color: #ecf0f1;
            font-size: 50px;
            padding: 20px;
            border-radius: 10px;
        }

        .time {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        span {
            padding: 10px;
            border-radius: 5px;
            background-color: #f39c12;
        }
    </style>
</head>

<body>
    <div class="clock">
        <div class="time">
            <span id="hours">00</span>:
            <span id="minutes">00</span>:
            <span id="seconds">00</span>
        </div>
    </div>

    <script src="index.js"></script>

</body>

</html>
