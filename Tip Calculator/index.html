<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
            width: 50%;
            margin: 0 auto;
        }
        form {
            margin: 0 auto;
            width: 50%;
        }
        input[type="text"] {
            width: 50px;
        }
        input[type="radio"] {
            margin: 0 10px;
        }
        #result {
            margin-top: 20px;
            font-size: 1.5em;
        }

    </style>
</head>
<body>
    <div class="container">
    <h1>Tip Calculator</h1>
    <form id="tipForm">
        <label for="bill">Bill subtotal: $</label>
        <input type="text" name="bill" id="bill" required>
        <br>
        <label for="tip">Tip percentage:</label>
        <br>
        <input type="radio" name="tip" id="tip10" value="10" required>10%
        <input type="radio" name="tip" id="tip15" value="15" required>15%
        <input type="radio" name="tip" id="tip20" value="20" required>20%
        <br>
        <input type="submit" value="Submit">
    </form>
    
    <div id="result"></div>

    </div>
    

    <script src="index.js"></script>

    
</body>
</html>
