<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palinderom checker</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f1f1f1;
        }
        h1{
            text-align: center;
            margin-bottom: 20px;
        }
        form{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        input{
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
        }
        button{
            padding: 10px 20px;
            border: none;
            background-color: #333;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Palinderom checker</h1>
    <form >
        <input type="text" name="word" placeholder="Enter a word">
        <button type="submit">Check</button>
    </form>
    <script src="index.js"></script>
    
</body>
</html>
